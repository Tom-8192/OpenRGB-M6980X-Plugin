name: Release

# A tag like v1.0.1 builds, tests and publishes a release with the plugin files.
# Release notes: docs/releases/<tag>.md (if present), otherwise generated by GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Tag matches the version in M6980XPlugin.json
        shell: bash
        run: grep -q "\"VersionStr\": \"${GITHUB_REF_NAME#v}\"" M6980XPlugin.json || { echo "Tag $GITHUB_REF_NAME does not match M6980XPlugin.json"; exit 1; }
      # same Qt and compiler as the official OpenRGB 1.0 Windows build
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
      - name: Build and test
        shell: pwsh
        run: ./scripts/build-windows.ps1 -OutputDirectory dist
      - name: Package
        shell: bash
        run: |
          DIR="OpenRGB-M6980X-${GITHUB_REF_NAME#v}-windows-x64"
          mkdir "$DIR"
          cp dist/OpenRGB-M6980X.dll README.md README.de.md LICENSE "$DIR/"
          7z a "$DIR.zip" "$DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: OpenRGB-M6980X-*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qmake6
      - name: Test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/protocol_test.cpp src/M6980XProtocol.cpp -o protocol_test
          ./protocol_test
      - name: Build
        run: |
          mkdir build && cd build
          qmake6 ../OpenRGB-M6980X.pro CONFIG+=release
          make -j"$(nproc)"
      - name: Package
        run: |
          DIR="OpenRGB-M6980X-${GITHUB_REF_NAME#v}-linux-x64-qt6"
          mkdir "$DIR"
          cp build/libOpenRGB-M6980X.so linux/60-openrgb-m6980x.rules README.md README.de.md LICENSE "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: OpenRGB-M6980X-*.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "OpenRGB M6980X plugin $GITHUB_REF_NAME" "${ARGS[@]}"
