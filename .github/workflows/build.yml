name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # same Qt and compiler as the official OpenRGB 1.0 Windows build
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
      - name: Build and test
        shell: pwsh
        run: ./scripts/build-windows.ps1 -OutputDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRGB-M6980X-windows-x64-qt6
          path: dist/OpenRGB-M6980X.dll
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qmake6
      - name: Test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/protocol_test.cpp src/M6980XProtocol.cpp -o protocol_test
          ./protocol_test
      - name: Build
        run: |
          mkdir build && cd build
          qmake6 ../OpenRGB-M6980X.pro CONFIG+=release
          make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRGB-M6980X-linux-x64-qt6
          path: build/libOpenRGB-M6980X.so
          if-no-files-found: error
